name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 Pillow requests html2image

      - name: Build Windows Executable
        run: |
          cd Graphic
          pyinstaller --noconsole --onefile --icon="app_icon.ico" --add-data "app_icon.ico;." --add-data "template;template" --name="GestionEauApp" main.py

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: GestionEauApp-Windows
          path: Graphic/dist/GestionEauApp.exe